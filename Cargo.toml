[package]
name = "mewski-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
poise = "0.6.1"
serenity = { version = "0.12.4", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "model",
    "utils",
    "rustls_backend",
] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "process"] }
log = "0.4.28"
pretty_env_logger = "0.5.0"
dotenvy = "0.15.7"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
