[package]
name = "mewski-ctf-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[dependencies]
poise = "0.6.1"
serenity = { version = "0.12.4", default-features = false, features = [
    "builder",
    "cache",
    "client",
    "gateway",
    "model",
    "utils",
    "rustls_backend",
] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
log = "0.4.28"
pretty_env_logger = "0.5.0"
dotenvy = "0.15.7"
